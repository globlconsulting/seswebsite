<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Society Hub - Login</title>
  <link rel="stylesheet" href="styles.css?v=6">
  <style>
    /* Basic styling for our demo login page */
    .login-container { max-width: 400px; margin: 100px auto; padding: 20px; background: rgba(0,0,0,0.8); border: 1px solid #c8a97e; border-radius: 8px; color: white; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #444; background: #222; color: white; }
    .btn-auth { width: 100%; padding: 10px; background: #c8a97e; color: black; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-auth:hover { background: #b09267; }
    .hidden { display: none; }
    .toggle-link { color: #c8a97e; cursor: pointer; font-size: 0.9em; display: block; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  
  <div class="login-container">
    <h2 id="form-title" style="text-align:center; color:#c8a97e; margin-bottom:20px;">Society Hub Login</h2>
    <div id="message" style="color:red; margin-bottom:10px; text-align:center;"></div>
    
    <!-- Email / Password Form -->
    <div id="email-form-container">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="member@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Password">
      </div>
      <button class="btn-auth" id="btn-login">Log In</button>
      <button class="btn-auth" id="btn-register" style="display:none;">Register</button>
      <button class="btn-auth" id="btn-reset" style="display:none;">Send Reset Link</button>
      
      <a href="members.html" class="toggle-link" style="text-decoration: none;">Need an account? Register</a>
      <span class="toggle-link" id="toggle-reset">Forgot Password?</span>
      <span class="toggle-link" id="toggle-phone">Login via SMS (OTP) instead</span>
    </div>

    <!-- Phone / SMS Form (Initially Hidden) -->
    <div id="phone-form-container" class="hidden">
      <div class="form-group" id="phone-input-group">
        <label>Phone Number</label>
        <input type="tel" id="phone-number" placeholder="+1234567890">
        <button class="btn-auth" id="btn-send-code">Send Verification Code</button>
      </div>
      
      <div class="form-group hidden" id="code-input-group">
        <label>Verification Code</label>
        <input type="text" id="verification-code" placeholder="123456">
        <button class="btn-auth" id="btn-verify-code">Verify & Login</button>
      </div>
      
      <div id="recaptcha-container" style="margin-top:10px;"></div>
      
      <span class="toggle-link" id="toggle-email">Back to Email Login</span>
    </div>

  </div>

  <!-- We use type="module" to allow importing from firebase.js -->
  <script type="module" src="login.js"></script>
</body>
</html>
